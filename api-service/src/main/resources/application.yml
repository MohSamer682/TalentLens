server:
  port: 8080
  error:
    # The whitelabel page renders HTML; every error must leave this service as JSON
    whitelabel:
      enabled: false
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

spring:
  mvc:
    # Surface unmapped paths as NoHandlerFoundException so GlobalExceptionHandler owns them
    throw-exception-if-no-handler-found: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/resume_screener}
    username: ${SPRING_DATASOURCE_USERNAME:rs_user}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
  flyway:
    # Databases built earlier by ddl-auto=update are adopted as V1 instead of re-created
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      # Flyway owns the schema (common/src/main/resources/db/migration); Hibernate only checks it
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 210MB

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET:resumes}
  # Host the browser uses to reach MinIO; presigned URLs are signed for this host
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${minio.endpoint}}

batch-worker:
  url: ${BATCH_WORKER_URL:http://localhost:8081}
  shared-secret: ${BATCH_WORKER_SHARED_SECRET}
management:
  endpoints:
    web:
      exposure:
        include: health,info
