server:
  port: 8081

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/resume_screener}
    username: ${SPRING_DATASOURCE_USERNAME:rs_user}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    # Databases built earlier by ddl-auto=update are adopted as V1 instead of re-created
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      # Flyway owns the schema (common/src/main/resources/db/migration); Hibernate only checks it
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET:resumes}

# LLM provider configuration — swap base-url + model for any OpenAI-compatible provider:
#
#  Provider       | base-url                                                        | example model
#  ---------------|-----------------------------------------------------------------|---------------------
#  OpenAI         | https://api.openai.com/v1                                       | gpt-4o
#  Kimi (Moonshot)| https://api.moonshot.cn/v1                                      | moonshot-v1-8k
#  Qwen (Alibaba) | https://dashscope.aliyuncs.com/compatible-mode/v1               | qwen-plus
#  Gemini (compat)| https://generativelanguage.googleapis.com/v1beta/openai         | gemini-3.5-flash
#  DeepSeek       | https://api.deepseek.com/v1                                     | deepseek-chat
#  Grok (xAI)     | https://api.x.ai/v1                                             | grok-3-mini
llm:
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:gpt-4o}
  base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
  rate-limit-rpm: ${LLM_RATE_LIMIT_RPM:60}

internal:
  shared-secret: ${BATCH_WORKER_SHARED_SECRET}

resilience4j:
  retry:
    instances:
      llm:
        max-attempts: 4
        wait-duration: 5s
        retry-exceptions:
          - com.resumescreener.batch.llm.LlmRetryableException
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
  ratelimiter:
    instances:
      llm:
        limit-for-period: ${llm.rate-limit-rpm:60}
        limit-refresh-period: 1m
        # A batch is async; queue for the next permit instead of failing the candidate after 30s
        timeout-duration: 5m
management:
  endpoints:
    web:
      exposure:
        include: health,info
