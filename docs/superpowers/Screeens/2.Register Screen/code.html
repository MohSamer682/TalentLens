<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create Account | Ethereal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "outline": "#747779",
            "primary": "#4647d3",
            "surface-container-low": "#eef1f3",
            "on-secondary-fixed-variant": "#7511c3",
            "tertiary": "#963776",
            "on-background": "#2c2f31",
            "tertiary-dim": "#882a69",
            "inverse-on-surface": "#9a9d9f",
            "on-primary-fixed-variant": "#0e009d",
            "error-dim": "#a70138",
            "primary-fixed-dim": "#8387ff",
            "on-tertiary-fixed": "#3b002b",
            "surface-container-highest": "#d9dde0",
            "surface-container-high": "#dfe3e6",
            "primary-fixed": "#9396ff",
            "on-tertiary-container": "#63054a",
            "primary-container": "#9396ff",
            "on-secondary-fixed": "#4f0089",
            "on-error-container": "#510017",
            "secondary-container": "#e5c6ff",
            "on-tertiary": "#ffeef4",
            "secondary-fixed-dim": "#dbb4ff",
            "on-surface": "#2c2f31",
            "outline-variant": "#abadaf",
            "tertiary-fixed-dim": "#ef81c4",
            "secondary-dim": "#740ec2",
            "inverse-surface": "#0b0f10",
            "surface-tint": "#4647d3",
            "surface-dim": "#d0d5d8",
            "surface-container-lowest": "#ffffff",
            "secondary": "#8126cf",
            "background": "#ffffff",
            "on-error": "#ffefef",
            "secondary-fixed": "#e5c6ff",
            "tertiary-fixed": "#ff8ed2",
            "primary-dim": "#3939c7",
            "on-primary": "#f4f1ff",
            "on-secondary-container": "#6900b4",
            "surface-variant": "#d9dde0",
            "on-primary-container": "#0a0081",
            "on-tertiary-fixed-variant": "#6e1354",
            "on-secondary": "#fbefff",
            "error": "#b41340",
            "on-primary-fixed": "#000000",
            "surface": "#ffffff",
            "surface-bright": "#ffffff",
            "surface-container": "#f8fafb",
            "inverse-primary": "#8083ff",
            "on-surface-variant": "#595c5e",
            "tertiary-container": "#ff8ed2",
            "error-container": "#f74b6d"
          },
          "borderRadius": {
            "DEFAULT": "1rem",
            "lg": "2rem",
            "xl": "3rem",
            "full": "9999px"
          },
          "fontFamily": {
            "headline": ["Inter"],
            "body": ["Inter"],
            "label": ["Inter"]
          }
        },
      },
    }
  </script>
<style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #ffffff;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
    }
    .ghost-border {
      outline: 1px solid rgba(171, 173, 175, 0.3);
    }
    .floating-label-group:focus-within label,
    .floating-label-group input:not(:placeholder-shown) + label {
      transform: translateY(-1.25rem) scale(0.85);
      color: #4647d3;
    }
  </style>
</head>
<body class="bg-white min-h-screen flex items-center justify-center p-6 antialiased">
<!-- Main Registration Container -->
<main class="w-full max-w-[480px] relative">
<!-- Glassmorphism Card -->
<div class="glass-card rounded-xl ghost-border shadow-2xl shadow-black/5 p-10 md:p-12 relative z-10">
<!-- Logo & Header -->
<header class="flex flex-col items-center mb-10">
<div class="w-16 h-16 rounded-full bg-gradient-to-tr from-primary to-secondary flex items-center justify-center mb-6 shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-on-primary text-3xl" data-icon="work">work</span>
</div>
<h1 class="text-on-background font-headline text-2xl font-semibold tracking-tight text-center">Create Account</h1>
<p class="text-on-surface-variant text-sm mt-2 font-body">Join the elite curation platform</p>
</header>
<!-- Form Section -->
<form class="space-y-6">
<!-- Full Name -->
<div class="relative floating-label-group">
<input class="w-full bg-surface-container-low/50 border-none rounded-lg px-5 py-4 text-on-surface placeholder-transparent focus:ring-1 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all outline-none" id="fullname" placeholder=" " type="text"/>
<label class="absolute left-5 top-4 text-on-surface-variant/70 text-sm transition-all pointer-events-none" for="fullname">Full Name</label>
</div>
<!-- Email Address -->
<div class="relative floating-label-group">
<input class="w-full bg-surface-container-low/50 border-none rounded-lg px-5 py-4 text-on-surface placeholder-transparent focus:ring-1 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all outline-none" id="email" placeholder=" " type="email"/>
<label class="absolute left-5 top-4 text-on-surface-variant/70 text-sm transition-all pointer-events-none" for="email">Email Address</label>
</div>
<!-- Password -->
<div class="relative floating-label-group">
<input class="w-full bg-surface-container-low/50 border-none rounded-lg px-5 py-4 text-on-surface placeholder-transparent focus:ring-1 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all outline-none" id="password" placeholder=" " type="password"/>
<label class="absolute left-5 top-4 text-on-surface-variant/70 text-sm transition-all pointer-events-none" for="password">Password</label>
</div>
<!-- Password Strength Indicator -->
<div class="space-y-2 px-1">
<div class="flex gap-1.5 h-1">
<div class="flex-1 rounded-full bg-primary h-full"></div>
<div class="flex-1 rounded-full bg-primary h-full"></div>
<div class="flex-1 rounded-full bg-surface-container-highest h-full"></div>
</div>
<div class="flex justify-between items-center">
<span class="text-[10px] font-medium uppercase tracking-widest text-primary">Medium Strength</span>
</div>
</div>
<!-- Confirm Password -->
<div class="relative floating-label-group">
<input class="w-full bg-surface-container-low/50 border-none rounded-lg px-5 py-4 text-on-surface placeholder-transparent focus:ring-1 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all outline-none" id="confirm_password" placeholder=" " type="password"/>
<label class="absolute left-5 top-4 text-on-surface-variant/70 text-sm transition-all pointer-events-none" for="confirm_password">Confirm Password</label>
</div>
<!-- Submit Button -->
<button class="w-full bg-gradient-to-r from-primary to-secondary text-on-primary font-medium py-4 rounded-full shadow-xl shadow-primary/25 hover:scale-[1.02] active:scale-[0.98] transition-all duration-300 mt-4" type="submit">
          Access Platform
        </button>
</form>
<!-- Footer Link -->
<footer class="mt-8 text-center">
<p class="text-on-surface-variant text-sm">
          Already have an account? 
          <a class="text-primary font-semibold hover:text-on-secondary-fixed-variant transition-colors ml-1" href="#">Login</a>
</p>
</footer>
</div>
<!-- Subtle Background Decorative Elements (Opacity Reduced for White BG) -->
<div class="absolute top-1/4 -left-20 w-64 h-64 bg-primary/5 rounded-full blur-3xl -z-0"></div>
<div class="absolute bottom-1/4 -right-20 w-80 h-80 bg-secondary/5 rounded-full blur-3xl -z-0"></div>
</main>
<!-- Global Footer Branding (Static) -->
<div class="fixed bottom-8 left-0 right-0 flex justify-center">
<div class="flex items-center gap-2 opacity-40">
<span class="text-[10px] font-medium uppercase tracking-[0.2em] text-on-surface">Ethereal Interface</span>
<span class="w-1 h-1 rounded-full bg-outline"></span>
<span class="text-[10px] font-medium uppercase tracking-[0.2em] text-on-surface">Edition 2024</span>
</div>
</div>
</body></html>
